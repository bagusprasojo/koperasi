{% extends "base.html" %}

{% block title %}Login | POS Koperasi{% endblock %}

{% block content %}
<div class="mx-auto mt-16 max-w-md rounded-xl bg-white p-6 shadow-sm">
    <h1 class="mb-1 text-2xl font-semibold">Masuk ke POS</h1>
    <p class="mb-6 text-sm text-slate-500">Gunakan akun yang sudah diberikan admin toko.</p>
    <form method="post" class="grid gap-4">
        {% csrf_token %}
        <div>
            <label class="mb-1 block text-sm font-medium">Username</label>
            <input type="text" name="username" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-800">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Password</label>
            <input type="password" name="password" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-800">
        </div>
        {% if form.errors %}
            <p class="text-sm text-red-600">Username atau password salah.</p>
        {% endif %}
        <button class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white">Login</button>
    </form>
</div>
{% endblock %}
