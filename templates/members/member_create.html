{% extends "base.html" %}
{% block title %}Tambah Member{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
    <div class="mb-4 flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
        <h1 class="text-xl font-semibold">Form Tambah Member</h1>
        <a href="{% url 'member_import_excel' %}" style="background-color: #eff6ff !important; color: #1d4ed8 !important; border: 1px solid #93c5fd !important;" class="inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-blue-100 transition-all shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" style="color: #2563eb;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span style="color: #1d4ed8 !important;" class="font-semibold">Import dari Excel (.xlsx)</span>
        </a>
    </div>
    <form method="post" class="grid gap-4">{% csrf_token %}
        <input name="code" value="{{ request.POST.code }}" placeholder="Kode member (unik)" class="rounded-md border border-slate-300 px-3 py-2">
        <input name="full_name" value="{{ request.POST.full_name }}" placeholder="Nama lengkap" class="rounded-md border border-slate-300 px-3 py-2">
        <input name="phone" value="{{ request.POST.phone }}" placeholder="Nomor telepon" class="rounded-md border border-slate-300 px-3 py-2">
        <input name="email" value="{{ request.POST.email }}" placeholder="Email (opsional)" class="rounded-md border border-slate-300 px-3 py-2">
        <input type="password" name="password" placeholder="Password login member" class="rounded-md border border-slate-300 px-3 py-2">
        <textarea name="address" placeholder="Alamat (opsional)" class="rounded-md border border-slate-300 px-3 py-2">{{ request.POST.address }}</textarea>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_active" {% if request.POST.is_active %}checked{% endif %}> Member aktif</label>
        <div class="flex gap-2"><a href="{% url 'member_list' %}" class="rounded-md border px-3 py-2 text-sm">Back</a><button class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white">Simpan</button></div>
    </form>
</div>
{% endblock %}
