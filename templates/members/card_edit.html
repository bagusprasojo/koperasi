{% extends "base.html" %}
{% block title %}Edit Kartu{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-xl font-semibold">Form Edit Kartu</h1>
    <form method="post" class="grid gap-4">{% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        <input value="{{ card.member.full_name }}" disabled class="rounded-md border border-slate-200 bg-slate-100 px-3 py-2">
        <input name="card_number" value="{{ card.card_number }}" readonly class="rounded-md border border-slate-200 bg-slate-100 px-3 py-2 text-slate-500">
        {% with s=request.POST.status|default:card.status %}
        <select name="status" class="rounded-md border border-slate-300 px-3 py-2">
            <option value="active" {% if s == 'active' %}selected{% endif %}>Active</option>
            <option value="blocked" {% if s == 'blocked' %}selected{% endif %}>Blocked</option>
            <option value="expired" {% if s == 'expired' %}selected{% endif %}>Expired</option>
        </select>
        {% endwith %}
        <div class="flex gap-2"><a href="{{ back_url }}" class="rounded-md border px-3 py-2 text-sm">Back</a><button class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white">Simpan</button></div>
    </form>
</div>
{% endblock %}
