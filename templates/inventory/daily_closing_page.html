{% extends "base.html" %}
{% block title %}Tutup Harian{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
    <div class="mb-4 flex items-center justify-between gap-3">
        <h1 class="text-xl font-semibold">Tutup Transaksi Harian</h1>
        <a href="{% url 'daily_closing_report' %}" class="rounded-md border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50">Report Validasi</a>
    </div>
    <form method="post" class="grid gap-3">
        {% csrf_token %}
        <input type="date" name="close_date" class="rounded-md border border-slate-300 px-3 py-2 text-sm">
        <textarea name="note" placeholder="Catatan closing" class="rounded-md border border-slate-300 px-3 py-2 text-sm"></textarea>
        <button class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white">Proses Tutup Harian</button>
    </form>
</div>
{% endblock %}
