{% extends "base.html" %}

{% block title %}Detail Kategori | POS Koperasi{% endblock %}

{% block content %}
<div class="rounded-xl bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-xl font-semibold">Detail Kategori</h1>
    <div class="grid gap-3 text-sm">
        <div>
            <p class="text-slate-500">Nama Kategori</p>
            <p class="font-medium">{{ category.name }}</p>
        </div>
        <div>
            <p class="text-slate-500">Dibuat</p>
            <p class="font-medium">{{ category.created_at }}</p>
        </div>
        <div>
            <p class="text-slate-500">Diubah</p>
            <p class="font-medium">{{ category.updated_at }}</p>
        </div>
    </div>

    <div class="mt-6 flex flex-wrap gap-2">
        <a href="{% url 'category_list' %}" class="rounded-md border px-3 py-2 text-sm">Back</a>
        <a href="{% url 'category_edit' category.uuid %}?next={{ request.path|urlencode }}" class="rounded-md border px-3 py-2 text-sm">Edit</a>
        <form method="post" action="{% url 'category_delete' category.uuid %}">
            {% csrf_token %}
            <button
                type="submit"
                @click.prevent="$dispatch('confirm-open', { form: $event.target.form, title: 'Konfirmasi Hapus', message: 'Kategori ini akan dihapus permanen.' })"
                class="rounded-md bg-red-600 px-3 py-2 text-sm text-white">Hapus</button>
        </form>
    </div>
</div>
{% endblock %}
