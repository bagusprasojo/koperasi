{% extends "base.html" %}

{% block title %}Tambah Kategori | POS Koperasi{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl rounded-xl bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-xl font-semibold">Form Tambah Kategori</h1>
    <form method="post" class="grid gap-4">
        {% csrf_token %}
        <div>
            <label class="mb-1 block text-sm font-medium">Nama Kategori</label>
            <input
                type="text"
                name="name"
                value="{{ request.POST.name }}"
                class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-800"
            >
        </div>
        {% if error_message %}
            <p class="text-sm text-red-600">{{ error_message }}</p>
        {% endif %}
        <div class="flex gap-2">
            <a href="{% url 'category_list' %}" class="rounded-md border px-3 py-2 text-sm">Back</a>
            <button class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white">Simpan</button>
        </div>
    </form>
</div>
{% endblock %}
