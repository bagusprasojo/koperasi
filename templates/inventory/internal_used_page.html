{% extends "base.html" %}
{% load humanize %}
{% block title %}Internal Used{% endblock %}
{% block content %}
<div class="rounded-xl bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-xl font-semibold">Transaksi Internal Used</h1>
    <form method="post" class="grid gap-3 md:grid-cols-4">
        {% csrf_token %}
        <select name="product_id" class="rounded-md border border-slate-300 px-3 py-2 text-sm">
            <option value="">Pilih produk</option>
            {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} (Stok: {{ p.stock|intcomma }})</option>
            {% endfor %}
        </select>
        <input type="number" name="qty" min="1" placeholder="Qty digunakan" class="rounded-md border border-slate-300 px-3 py-2 text-sm">
        <input type="text" name="note" placeholder="Catatan" class="rounded-md border border-slate-300 px-3 py-2 text-sm md:col-span-2">
        <button class="rounded-md bg-slate-900 px-3 py-2 text-sm text-white md:col-span-4">Posting Internal Used</button>
    </form>
</div>
{% endblock %}
